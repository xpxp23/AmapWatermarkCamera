      <path d="M 314 570 L 364 450 L 464 480 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <path d="M 344 350 L 474 320 L 504 420 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    </g>

    <!-- Inner Core Optical Pupil -->
    <circle cx="512" cy="480" r="145" fill="#020817" stroke="#0EA5E9" stroke-width="2.5" />
    <circle cx="512" cy="480" r="138" fill="#050C1F" />

    <!-- Lens Specular Glare / Curved Glass Highlight -->
    <path d="M 310 360 C 350 290, 440 250, 550 250 C 650 250, 700 280, 720 320 C 630 280, 520 275, 410 310 C 350 330, 320 350, 310 360 Z" fill="url(#specularHighlight)" />
  </g>

  <!-- Surveyor Crosshair Precision Reticles -->
  <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <!-- Top Reticle -->
    <line x1="512" y1="310" x2="512" y2="345" />
    <!-- Bottom Reticle -->
    <line x1="512" y1="615" x2="512" y2="650" />
    <!-- Left Reticle -->
    <line x1="342" y1="480" x2="377" y2="480" />
    <!-- Right Reticle -->
    <line x1="647" y1="480" x2="682" y2="480" />
    <!-- Inner Crosshair Center Dots -->
    <circle cx="512" cy="480" r="4" fill="#38BDF8" />
  </g>

  <!-- Luminous Location Pin (Floating In Focal Point) -->
  <g filter="url(#pinShadow)">
    <!-- Stylized Modern Glassmorphic Pin -->
    <path d="M 512 370
             C 470 370, 436 404, 436 446
             C 436 492, 492 562, 512 584
             C 532 562, 588 492, 588 446
             C 588 404, 554 370, 512 370 Z"
          fill="url(#pinGrad)"
          stroke="#BAE6FD"
          stroke-width="3.5" />

    <!-- Pin Inner Core (Camera Sensor Aperture) -->
    <circle cx="512" cy="444" r="30" fill="#04091A" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="512" cy="444" r="16" fill="#38BDF8" />
    <!-- Tiny Glint on Pin -->
    <circle cx="496" cy="420" r="7" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Golden Floating Coordinate Watermark Badge (Bottom Center) -->
  <g filter="url(#softShadow)">
    <rect x="362" y="736" width="300" height="48" rx="24" fill="#0F172ACC" stroke="#38BDF888" stroke-width="1.5" />
    <!-- Camera Glyph -->
    <circle cx="396" cy="760" r="7" fill="none" stroke="#38BDF8" stroke-width="2" />
    <circle cx="396" cy="760" r="3" fill="#38BDF8" />
    <!-- Lat/Lon Coordinate Monospace Text -->
    <text x="418" y="766" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.5">GCJ-02 · 零偏差</text>
  </g>
</svg>
