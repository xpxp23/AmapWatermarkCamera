  <!-- Cardinal Coordinates Labels -->
  <text x="512" y="96" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="2" opacity="0.9">N 0°</text>
  <text x="512" y="888" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2" opacity="0.6">S 180°</text>
  <text x="120" y="488" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2" opacity="0.6">W 270°</text>
  <text x="904" y="488" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2" opacity="0.6">E 90°</text>

  <!-- 3D Longitude & Latitude Orbital Ellipses (经纬网弧线) -->
  <g filter="url(#neonGlow)">
    <!-- Primary Equator / Latitude Ellipse -->
    <ellipse cx="512" cy="480" rx="340" ry="115" transform="rotate(-18 512 480)" fill="none" stroke="url(#cyanNeon)" stroke-width="3" stroke-dasharray="14 10" opacity="0.75" />
    <!-- Secondary Meridian / Longitude Ellipse -->
    <ellipse cx="512" cy="480" rx="140" ry="340" transform="rotate(-18 512 480)" fill="none" stroke="url(#cyanNeon)" stroke-width="2.5" opacity="0.6" />
    <!-- Golden Accent Latitude Orbit -->
    <ellipse cx="512" cy="480" rx="320" ry="200" transform="rotate(35 512 480)" fill="none" stroke="url(#amberNeon)" stroke-width="2" stroke-dasharray="8 8" opacity="0.45" />
  </g>

  <!-- Main Camera Lens Body with Drop Shadow -->
  <g filter="url(#softShadow)">
    <!-- Outer Titanium Bezel -->
    <circle cx="512" cy="480" r="280" fill="url(#bezelGrad)" stroke="#475569" stroke-width="2" />
    <circle cx="512" cy="480" r="268" fill="#0B132B" stroke="#1E293B" stroke-width="4" />
    <circle cx="512" cy="480" r="256" fill="#030712" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Optical Camera Lens Glass Depth -->
    <circle cx="512" cy="480" r="248" fill="url(#lensGlass)" />

    <!-- Aperture Blades Geometry (6 geometric iris lines) -->
    <g opacity="0.35">
      <path d="M 512 250 L 590 350 L 512 430 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <path d="M 710 390 L 660 510 L 560 480 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <path d="M 680 610 L 550 640 L 520 540 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
