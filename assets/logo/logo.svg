<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Center Radial Cosmic Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#0369A1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Bezel Metallic Rim -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Lens Glass Depth -->
    <radialGradient id="lensGlass" cx="38%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#0C1D4A" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#04091A" />
      <stop offset="100%" stop-color="#02050E" />
    </radialGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Warm Amber / Gold Gradient -->
    <linearGradient id="amberNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Floating Location Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Specular Highlight for Lens -->
    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base App Icon Squircle (Standard iOS/WeChat radius 224px) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />

  <!-- Ambient Lens Glow -->
  <circle cx="512" cy="480" r="420" fill="url(#centerGlow)" />

  <!-- Outer Coordinate Dial & Degree Ticks -->
  <circle cx="512" cy="480" r="410" stroke="#334155" stroke-width="1.5" fill="none" opacity="0.4" />
