<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>极速经纬水印相机 v6.0.0 · 专业实景高德零偏差版</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    .text-shadow-strong {
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85), 0 1px 3px rgba(0, 0, 0, 0.9);
    }
    @keyframes shutterFlash {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .animate-flash {
      animation: shutterFlash 0.22s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen bg-black text-white flex flex-col items-center justify-center select-none">

  <div class="w-full max-w-[460px] min-h-screen sm:min-h-[840px] sm:max-h-[92vh] sm:rounded-[32px] sm:border sm:border-neutral-800 bg-black flex flex-col justify-between overflow-hidden shadow-2xl relative">

    <!-- ==================== 1. TOP BLACK CAMERA BAR ==================== -->
    <header class="w-full h-[82px] bg-black px-5 flex items-center justify-between shrink-0 z-20">
      <button id="btnTopSettings" type="button" class="flex flex-col items-center gap-1 group active:scale-95 transition">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="text-[11px] text-neutral-200 tracking-wide">设置</span>
      </button>

      <div id="inlineTimerBar" class="hidden flex-1 mx-2 bg-slate-900 border border-slate-700 rounded-full px-3 py-1 items-center justify-between text-xs">
        <span class="text-slate-400">⏱ 倒计时</span>
        <button type="button" data-timer="0" class="timer-opt px-2.5 py-0.5 rounded-full bg-sky-600 text-white font-bold">关闭</button>
        <button type="button" data-timer="3" class="timer-opt px-2.5 py-0.5 rounded-full text-slate-300">3秒</button>
        <button type="button" data-timer="5" class="timer-opt px-2.5 py-0.5 rounded-full text-slate-300">5秒</button>
        <button type="button" data-timer="10" class="timer-opt px-2.5 py-0.5 rounded-full text-slate-300">10秒</button>
      </div>

      <div id="inlineFlashBar" class="hidden flex-1 mx-2 bg-slate-900 border border-slate-700 rounded-full px-3 py-1 items-center justify-between text-xs">
        <span class="text-slate-400">⚡ 闪光</span>
        <button type="button" data-flash="0" class="flash-opt px-2.5 py-0.5 rounded-full bg-amber-500 text-black font-bold">关闭</button>
        <button type="button" data-flash="1" class="flash-opt px-2.5 py-0.5 rounded-full text-slate-300">开启</button>
        <button type="button" data-flash="2" class="flash-opt px-2.5 py-0.5 rounded-full text-slate-300">自动</button>
        <button type="button" data-flash="3" class="flash-opt px-2.5 py-0.5 rounded-full text-slate-300">常亮</button>
      </div>

      <div id="topRightIconsRow" class="flex items-center gap-4">
        <button id="btnTopCaptureMode" type="button" class="flex flex-col items-center gap-1 active:scale-95 transition" title="切换光学拍照与极速截屏模式">
          <svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
            <rect x="3" y="6" width="18" height="13" rx="2.5"/>
            <circle cx="12" cy="12.5" r="3.5"/>
          </svg>
          <span id="captureModeLabel" class="text-[11px] text-sky-300">光学拍照</span>
        </button>

        <button id="btnTopOrientation" type="button" class="flex flex-col items-center gap-1 active:scale-95 transition">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
            <rect x="5" y="3" width="14" height="18" rx="2"/>
            <path stroke-linecap="round" d="M9 18h6"/>
          </svg>
          <span id="oriLabelText" class="text-[11px] text-neutral-200">竖屏</span>
        </button>

        <button id="btnTopTimer" type="button" class="flex flex-col items-center gap-1 active:scale-95 transition">
          <div class="relative w-6 h-6 flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l2.5 2.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span id="timerBadgeText" class="hidden absolute -bottom-0.5 -right-1 text-[10px] font-bold text-sky-400 bg-black px-0.5 rounded">3</span>
          </div>
          <span id="timerLabelText" class="text-[11px] text-neutral-200">倒计时</span>
        </button>

        <button id="btnTopFlash" type="button" class="flex flex-col items-center gap-1 active:scale-95 transition">
          <div class="relative w-6 h-6 flex items-center justify-center">
            <svg id="flashSvgIcon" class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span id="flashBadgeText" class="text-[10px] font-medium text-white ml-0.5">关</span>
          </div>
          <span class="text-[11px] text-neutral-200">闪光灯</span>
        </button>

        <button id="btnTopFlip" type="button" class="flex flex-col items-center gap-1 active:scale-95 transition">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16v10H4V7zm4 5h.01M16 12h.01"/>
          </svg>
          <span class="text-[11px] text-neutral-200">翻转</span>
        </button>
      </div>
    </header>

    <!-- ==================== 2. CENTER LIVE CAMERA VIEWFINDER ==================== -->
    <div id="viewfinderContainer" class="relative w-full flex-1 bg-neutral-900 overflow-hidden cursor-crosshair">
      <video id="cameraVideo" autoplay playsinline muted class="hidden w-full h-full object-cover"></video>
      <canvas id="viewfinderCanvas" width="1080" height="1440" class="w-full h-full object-cover block"></canvas>

      <!-- WYSIWYG Live Watermark Overlay Canvas (Renders all 5 templates + QR code identically to photo output) -->
      <canvas id="liveWatermarkCanvas" width="1080" height="1440" class="pointer-events-none absolute inset-0 w-full h-full object-cover z-20"></canvas>

      <div id="shutterFlashOverlay" class="pointer-events-none absolute inset-0 bg-white opacity-0 z-30"></div>

      <button id="btnGpsPill" type="button" class="absolute top-3 left-3 z-30 px-3 py-1 rounded-full bg-slate-950/75 backdrop-blur-md border border-sky-400/30 flex items-center gap-1.5 text-[11px] font-mono-num text-white shadow">
        <span id="gpsDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="gpsPillText">GCJ-02 · ±2.4m · 光学拍照</span>
      </button>

      <div id="countdownOverlay" class="hidden pointer-events-none absolute inset-0 z-30 flex items-center justify-center">
        <span id="countdownNumText" class="text-8xl font-bold text-white text-shadow-strong">3</span>
      </div>

      <div id="focusBoxWrapper" class="pointer-events-none absolute z-10 flex items-center gap-2 transition-all duration-150" style="left: 56%; top: 26%;">
        <div class="relative w-[78px] h-[78px] border-[1.8px] border-white">
          <span class="absolute top-0 left-1/2 -translate-x-1/2 w-[1.8px] h-2 bg-white"></span>
          <span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[1.8px] h-2 bg-white"></span>
          <span class="absolute left-0 top-1/2 -translate-y-1/2 w-2 h-[1.8px] bg-white"></span>
          <span class="absolute right-0 top-1/2 -translate-y-1/2 w-2 h-[1.8px] bg-white"></span>
        </div>
        <svg class="w-6 h-6 text-white drop-shadow" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"/>
          <path stroke-linecap="round" d="M12 3v2m0 14v2M3 12h2m14 0h2m-15.36-6.36l1.42 1.42m11.31 11.31l1.42 1.42M5.64 18.36l1.42-1.42m11.31-11.31l1.42-1.42"/>
        </svg>
      </div>

      <button id="btnZoomCircle" type="button" class="absolute right-3.5 top-[48%] z-30 w-11 h-11 rounded-full bg-black/45 border-[1.5px] border-white flex items-center justify-center text-xs font-semibold text-white backdrop-blur-sm active:scale-95 transition">
        1.0X
      </button>
    </div>

    <!-- 5-Template Quick Switcher Bar -->
    <div id="tplQuickBar" class="w-full bg-slate-950 border-t border-slate-900 px-2.5 py-1.5 flex items-center justify-between gap-1.5 z-20 text-[11px]">
      <button type="button" data-tpl="0" class="tpl-quick-pill flex-1 py-1 rounded-full font-bold bg-sky-600 text-white">大字时间</button>
      <button type="button" data-tpl="1" class="tpl-quick-pill flex-1 py-1 rounded-full text-slate-400 bg-slate-900">巡检卡片</button>
      <button type="button" data-tpl="2" class="tpl-quick-pill flex-1 py-1 rounded-full text-slate-400 bg-slate-900">网格测绘</button>
      <button type="button" data-tpl="3" class="tpl-quick-pill flex-1 py-1 rounded-full text-slate-400 bg-slate-900">胶片底栏</button>
      <button type="button" data-tpl="4" class="tpl-quick-pill flex-1 py-1 rounded-full text-slate-400 bg-slate-900">标准台账</button>
    </div>

    <!-- Optional Live Filter Selector Bar -->
    <div id="filterBarStrip" class="hidden w-full bg-neutral-950 border-t border-neutral-800 px-4 py-2 flex items-center justify-around z-20">
      <button type="button" data-filter="0" class="filter-chip px-3 py-1 rounded-full text-xs font-semibold bg-sky-600 text-white">原图</button>
      <button type="button" data-filter="1" class="filter-chip px-3 py-1 rounded-full text-xs text-neutral-300 bg-neutral-800">鲜明</button>
      <button type="button" data-filter="2" class="filter-chip px-3 py-1 rounded-full text-xs text-neutral-300 bg-neutral-800">暖阳</button>
      <button type="button" data-filter="3" class="filter-chip px-3 py-1 rounded-full text-xs text-neutral-300 bg-neutral-800">清冷</button>
      <button type="button" data-filter="4" class="filter-chip px-3 py-1 rounded-full text-xs text-neutral-300 bg-neutral-800">黑白</button>
    </div>

    <!-- ==================== 3. BOTTOM BLACK CONTROL BAR ==================== -->
    <footer class="w-full h-[126px] bg-black px-6 flex items-center justify-between shrink-0 z-20">
      <button id="btnBottomGallery" type="button" class="flex flex-col items-center gap-1.5 active:scale-95 transition">
        <div class="relative w-11 h-11 rounded-full overflow-hidden border-[1.5px] border-white bg-neutral-800">
          <img id="bottomGalleryThumb" src="" alt="相册" class="w-full h-full object-cover" />
        </div>
        <span class="text-xs text-white">相册</span>
      </button>

      <button id="btnBottomLocation" type="button" class="flex flex-col items-center gap-1.5 active:scale-95 transition">
        <div class="w-11 h-11 flex items-center justify-center">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 3L3 10.5l8.25 3L14.25 21 21 3z"/>
          </svg>
        </div>
        <span class="text-xs text-white">地点</span>
      </button>

      <button id="btnShutterMain" type="button" aria-label="拍照" class="w-[76px] h-[76px] rounded-full border-[4px] border-sky-400 p-1.5 flex items-center justify-center active:scale-90 transition-transform">
        <span class="w-full h-full rounded-full bg-white/15 hover:bg-white/25 transition"></span>
      </button>

      <button id="btnBottomFilter" type="button" class="flex flex-col items-center gap-1.5 active:scale-95 transition">
        <div class="w-11 h-11 flex items-center justify-center">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
            <circle cx="12" cy="8.5" r="4.5"/>
            <circle cx="8.5" cy="14.5" r="4.5"/>
            <circle cx="15.5" cy="14.5" r="4.5"/>
          </svg>
        </div>
        <span class="text-xs text-white">滤镜</span>
      </button>

      <button id="btnBottomWatermark" type="button" class="flex flex-col items-center gap-1.5 active:scale-95 transition">
        <div class="w-11 h-11 flex items-center justify-center">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="2.5"/>
            <path stroke-linecap="round" d="M7 9h10M8 15h.01M12 15h.01M16 15h.01"/>
          </svg>
        </div>
        <span class="text-xs text-white">水印</span>
      </button>
    </footer>

    <!-- ==================== OVERLAY SCREEN: IN-APP GALLERY ==================== -->
    <div id="screenGallery" class="hidden absolute inset-0 z-40 bg-slate-950 flex-col justify-between">
      <div class="bg-black px-4 py-3.5 flex items-center justify-between border-b border-slate-800">
        <button id="btnGalleryBack" type="button" class="text-sm font-semibold text-white flex items-center gap-1">
          <span>← 返回相机</span>
        </button>
        <span id="galleryTitleText" class="text-sm font-bold text-white">已拍相册 (1)</span>
        <label for="inputImportExifPhoto" class="cursor-pointer px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-xs font-semibold text-white">
          📥 导入相册照片
        </label>
        <input id="inputImportExifPhoto" type="file" accept="image/jpeg,image/png,image/webp" class="hidden" />
      </div>

      <div class="flex-1 bg-black flex items-center justify-center p-2 overflow-hidden">
        <img id="galleryMainImg" src="" alt="已拍照片大图" class="max-w-full max-h-full object-contain rounded-lg" />
      </div>

      <div class="bg-slate-900 border-t border-slate-800 p-3.5 space-y-2.5">
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div id="galleryPoiTitle" class="text-sm font-bold text-white truncate">📍 小庄村</div>
            <div id="galleryGcjText" class="text-xs font-mono-num font-semibold text-sky-400">高德 GCJ-02: 39.908823°N, 116.397470°E</div>
            <div id="galleryWgsText" class="text-[11px] font-mono-num text-slate-400">原始 WGS-84: 39.907419°N, 116.391228°E</div>
          </div>
          <button id="btnGalleryCopyCoord" type="button" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono-num text-sky-300 border border-slate-700 shrink-0">
            复制坐标
          </button>
        </div>

        <div class="grid grid-cols-12 gap-2">
          <a id="btnGalleryJumpAmapPin" href="https://uri.amap.com/marker" target="_blank" class="col-span-7 py-2.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white text-center shadow-lg flex items-center justify-center gap-1">
            <span>📍 一键跳高德地图 (丝毫不差)</span>
          </a>
          <a id="btnGalleryJumpAmapNavi" href="https://uri.amap.com/navigation" target="_blank" class="col-span-5 py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white text-center shadow-lg flex items-center justify-center gap-1">
            <span>🧭 导航去这里</span>
          </a>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button id="btnGalleryEditWm" type="button" class="col-span-2 py-2 px-3 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-xs font-semibold text-amber-300">
            ✎ 修改水印内容/样式 (无损重绘)
          </button>
          <button id="btnGalleryDownload" type="button" class="py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-white">
            ⬇ 保存图片
          </button>
        </div>
      </div>

      <div id="galleryThumbStrip" class="bg-black px-3 py-2.5 flex items-center gap-2.5 overflow-x-auto border-t border-slate-900">
      </div>
    </div>

    <!-- ==================== MODAL: 地点与高德零偏差校准 ==================== -->
    <div id="modalLocation" class="hidden absolute inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
      <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full p-4 space-y-3">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
          <h3 class="text-sm font-bold text-white">📍 地点与高德坐标校准</h3>
          <button id="btnCloseLocationModal" type="button" class="text-slate-400 hover:text-white text-sm">✕</button>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs space-y-1 font-mono-num">
          <div class="text-sky-400 font-bold">高德 GCJ-02: <span id="locModalGcj">39.908823, 116.397470</span></div>
          <div class="text-slate-400">原始 WGS-84: <span id="locModalWgs">39.907419, 116.391228</span></div>
        </div>
        <div class="space-y-2 text-xs">
          <div>
            <label for="inputShortPoi" class="block text-slate-400 mb-1">地点简称 (例如：小庄村 / 1号点位)</label>
            <input id="inputShortPoi" type="text" value="小庄村" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-white" />
          </div>
          <div>
            <label for="inputFullAddr" class="block text-slate-400 mb-1">详细地址描述</label>
            <input id="inputFullAddr" type="text" value="北京市朝阳区小庄村" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-white" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label for="inputManualLat" class="block text-slate-400 mb-1">高德纬度 GCJ-02</label>
              <input id="inputManualLat" type="number" step="0.000001" value="39.908823" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 font-mono-num text-white" />
            </div>
            <div>
              <label for="inputManualLon" class="block text-slate-400 mb-1">高德经度 GCJ-02</label>
              <input id="inputManualLon" type="number" step="0.000001" value="116.397470" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 font-mono-num text-white" />
            </div>
          </div>
        </div>
        <div class="flex gap-2 pt-1">
          <button id="btnRequestRealGps" type="button" class="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-sky-300 border border-slate-700">
            🛰 刷新真实GPS
          </button>
          <button id="btnSaveLocationModal" type="button" class="flex-1 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white">
            保存并应用
          </button>
        </div>
      </div>
    </div>

    <!-- ==================== MODAL: 水印样式与字段定制 ==================== -->
    <div id="modalWatermark" class="hidden absolute inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
      <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full p-4 space-y-3 max-h-[88vh] overflow-y-auto">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
          <h3 id="wmModalTitle" class="text-sm font-bold text-white">🎨 水印模板与字段定制</h3>
          <button id="btnCloseWmModal" type="button" class="text-slate-400 hover:text-white text-sm">✕</button>
        </div>

        <div class="space-y-2.5 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label for="wmSelectStyle" class="block text-slate-400 mb-1">水印模板样式</label>
              <select id="wmSelectStyle" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white">
                <option value="0">经典大字时间</option>
                <option value="1">工程巡检卡片</option>
                <option value="2">经纬网格测绘</option>
                <option value="3">极简胶片底栏</option>
                <option value="4">外业标准台账</option>
              </select>

  <script>
    const PI = Math.PI;
    const AXIS = 6378245.0;
    const OFFSET_EE = 0.00669342162296594323;

    function outOfChina(lat, lon) {
      return (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271);
    }
    function transformLat(x, y) {
      let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
      ret += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
      return ret;
    }
    function transformLon(x, y) {
      let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
      ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
      return ret;
    }

    function wgs84ToGcj02(wgsLat, wgsLon) {
      const lat = Number(wgsLat), lon = Number(wgsLon);
      if (outOfChina(lat, lon)) return { lat, lon };
      let dLat = transformLat(lon - 105.0, lat - 35.0);
      let dLon = transformLon(lon - 105.0, lat - 35.0);
      const radLat = lat / 180.0 * PI;
      let magic = Math.sin(radLat);
      magic = 1 - OFFSET_EE * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((AXIS * (1 - OFFSET_EE)) / (magic * sqrtMagic) * PI);
      dLon = (dLon * 180.0) / (AXIS / sqrtMagic * Math.cos(radLat) * PI);
      return { lat: Number((lat + dLat).toFixed(6)), lon: Number((lon + dLon).toFixed(6)) };
    }

    function gcj02ToWgs84(gcjLat, gcjLon) {
      const lat = Number(gcjLat), lon = Number(gcjLon);
      if (outOfChina(lat, lon)) return { lat, lon };
      let wgsLat = lat, wgsLon = lon;
      for (let i = 0; i < 6; i++) {
        const curr = wgs84ToGcj02(wgsLat, wgsLon);
        wgsLat += (lat - curr.lat);
        wgsLon += (lon - curr.lon);
      }
      return { lat: Number(wgsLat.toFixed(6)), lon: Number(wgsLon.toFixed(6)) };
    }

    function toDMS(deg, isLat) {
      const dir = isLat ? (deg >= 0 ? 'N' : 'S') : (deg >= 0 ? 'E' : 'W');
      const totalCentis = Math.round(Math.abs(Number(deg)) * 360000);
      const d = Math.floor(totalCentis / 360000);
      const rem = totalCentis % 360000;
      const m = Math.floor(rem / 6000);
      const s = ((rem % 6000) / 100).toFixed(2);
      return d + '°' + String(m).padStart(2, '0') + "'" + String(s).padStart(5, '0') + '"' + dir;
    }

    function formatCoords(lat, lon, dms) {
      if (dms === 'DMS') return toDMS(lat, true) + ', ' + toDMS(lon, false);
      return Number(lat).toFixed(6) + '°N, ' + Number(lon).toFixed(6) + '°E';
    }

    function getNowTimeParts() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      const weeks = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
      const dateWeek = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + weeks[d.getDay()];
      const fullTs = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm + ':' + pad(d.getSeconds());
      return { hm, dateWeek, fullTs };
    }

    // Pure JS ISO/IEC 18004 QR Code Matrix Generator (Byte mode, ECC Level L)
    const QR_SPECS = [
      { ver: 1, size: 21, dataBytes: 19, eccBytes: 7, align: [] },
      { ver: 2, size: 25, dataBytes: 34, eccBytes: 10, align: [6, 18] },
      { ver: 3, size: 29, dataBytes: 55, eccBytes: 15, align: [6, 22] },
      { ver: 4, size: 33, dataBytes: 80, eccBytes: 20, align: [6, 26] },
      { ver: 5, size: 37, dataBytes: 108, eccBytes: 26, align: [6, 30] }
    ];
    function gfMul(x, y) {
      let z = 0;
      for (let i = 7; i >= 0; i--) {
        z = (z << 1) ^ ((z >>> 7) * 0x11D);
        z ^= ((y >>> i) & 1) * x;
      }
      return z;
    }
    function rsEncode(data, deg) {
      const gen = new Array(deg).fill(0);
      gen[deg - 1] = 1;
      let root = 1;
      for (let i = 0; i < deg; i++) {
        for (let j = 0; j < deg; j++) {
          gen[j] = gfMul(gen[j], root);
          if (j + 1 < deg) gen[j] ^= gen[j + 1];
        }
        root = gfMul(root, 2);
      }
      const rem = new Array(deg).fill(0);
      for (const b of data) {
        const factor = b ^ rem[0];
        rem.shift();
        rem.push(0);
        for (let j = 0; j < deg; j++) rem[j] ^= gfMul(gen[j], factor);
      }
      return rem;
    }
    function encodeQrMatrix(text) {
      const utf8 = Array.from(new TextEncoder().encode(text));
      const spec = QR_SPECS.find(s => utf8.length + 3 <= s.dataBytes) || QR_SPECS[QR_SPECS.length - 1];
      const bytes = utf8.slice(0, spec.dataBytes - 3);
      const bits = [];
      const pushBits = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
      pushBits(4, 4);
      pushBits(bytes.length, 8);
      bytes.forEach(b => pushBits(b, 8));
      const maxBits = spec.dataBytes * 8;
      pushBits(0, Math.min(4, maxBits - bits.length));
      while (bits.length % 8 !== 0) bits.push(0);
      const pads = [0xEC, 0x11];
      let pi = 0;
      while (bits.length < maxBits) pushBits(pads[pi++ % 2], 8);
      const dataCw = [];
      for (let i = 0; i < spec.dataBytes; i++) {
        let v = 0;
        for (let b = 0; b < 8; b++) v = (v << 1) | bits[i * 8 + b];
        dataCw.push(v);
      }
      const allCw = dataCw.concat(rsEncode(dataCw, spec.eccBytes));
      const sz = spec.size;
      const mat = Array.from({ length: sz }, () => new Array(sz).fill(false));
      const fn = Array.from({ length: sz }, () => new Array(sz).fill(false));
      const setFn = (x, y, d) => { if (x >= 0 && x < sz && y >= 0 && y < sz) { mat[y][x] = d; fn[y][x] = true; } };
      const finder = (cx, cy) => {
        for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
          const dist = Math.max(Math.abs(dx), Math.abs(dy));
          setFn(cx + dx, cy + dy, dist !== 2 && dist !== 4);
        }
      };
      finder(3, 3); finder(sz - 4, 3); finder(3, sz - 4);
      for (let i = 0; i < sz; i++) {
        if (!fn[6][i]) setFn(i, 6, i % 2 === 0);
        if (!fn[i][6]) setFn(6, i, i % 2 === 0);
      }
      for (const ay of spec.align) for (const ax of spec.align) {
        if ((ax === 6 && ay === 6) || (ax === 6 && ay === sz - 7) || (ax === sz - 7 && ay === 6)) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          setFn(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }
      for (let i = 0; i <= 8; i++) if (i !== 6) { fn[8][i] = true; fn[i][8] = true; }
      for (let i = 0; i <= 7; i++) { fn[8][sz - 1 - i] = true; fn[sz - 1 - i][8] = true; }
      setFn(8, sz - 8, true);

      let bitIdx = 0, right = sz - 1, vert = 0;
      while (right >= 1) {
        if (right === 6) right = 5;
        for (let c = 0; c < sz; c++) {
          const y = (vert & 1) === 0 ? (sz - 1 - c) : c;
          for (let j = 0; j < 2; j++) {
            const x = right - j;
            if (!fn[y][x]) {
              const dark = bitIdx < allCw.length * 8 ? (((allCw[bitIdx >>> 3] >>> (7 - (bitIdx & 7))) & 1) !== 0) : false;
              mat[y][x] = dark;
              bitIdx++;
            }
          }
        }
        right -= 2; vert++;
      }
      for (let y = 0; y < sz; y++) for (let x = 0; x < sz; x++) if (!fn[y][x] && (x + y) % 2 === 0) mat[y][x] = !mat[y][x];
      const fmt = 0x77C4;
      const bit = i => ((fmt >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) mat[8][i] = bit(i);
      mat[8][7] = bit(6); mat[8][8] = bit(7); mat[7][8] = bit(8);
      for (let i = 9; i <= 14; i++) mat[14 - i][8] = bit(i);
      for (let i = 0; i <= 7; i++) mat[sz - 1 - i][8] = bit(i);
      for (let i = 8; i <= 14; i++) mat[8][sz - 15 + i] = bit(i);
      mat[sz - 8][8] = true;
      return mat;
    }

    const state = {
      captureMode: 1, // 1: 光学拍照模式, 0: 极速截屏模式
      timerSec: 0,
      flashMode: 0,
      isFront: false,
      zoom: 1.0,
      filterIdx: 0,
      usingRealCam: false,
      stream: null,
      gcjLat: 39.908823,
      gcjLon: 116.397470,
      wgsLat: 39.907419,
      wgsLon: 116.391228,
      accuracy: 2.4,
      altitude: 48.5,
      azimuthText: '东北 034°',
      shortPoi: '小庄村',
      fullAddr: '北京市朝阳区建国路小庄村',
      styleTemplate: 0,

    };

    const FILTER_CSS = [
      'none',
      'contrast(1.18) saturate(1.22)',
      'sepia(0.25) saturate(1.3) brightness(1.04)',

    function showToast(msg) {
      const box = document.getElementById('toastBox');

    function drawViewfinderScene(ctx, w, h) {
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#2b211c');
      g.addColorStop(0.45, '#1e293b');
      g.addColorStop(1, '#0f766e');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#248f9d';
      ctx.beginPath();
      ctx.moveTo(0, h * 0.34);
      ctx.lineTo(w, h * 0.62);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h * 0.88);
      ctx.closePath();
      ctx.fill();

      ctx.save();
      ctx.translate(w * 0.52, h * 0.48);
      ctx.rotate(0.42);
      ctx.fillStyle = '#18181b';
      ctx.fillRect(-360, -150, 720, 290);
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 13; c++) {
          ctx.fillStyle = (c === 0 || c === 12 || r === 4) ? '#d97706' : '#f4f4f5';
          ctx.fillRect(-335 + c * 51, -130 + r * 52, 44, 44);
        }
      }
      ctx.restore();
    }

    // Unified 5-Template + QR Badge Canvas Renderer (shared by Live Viewfinder & Photo Export)
    function drawWatermarkOnCanvas(ctx, w, h, cfg) {
      const lat = cfg.coordSys === 'WGS-84' ? cfg.wgsLat : cfg.gcjLat;
      const lon = cfg.coordSys === 'WGS-84' ? cfg.wgsLon : cfg.gcjLon;
      const coordLine = formatCoords(lat, lon, cfg.coordFmt) + ' [' + cfg.coordSys + '] ±' + Number(cfg.accuracy).toFixed(1) + 'm';
      const envLine = cfg.showEnv ? ('海拔 ' + cfg.altitude.toFixed(1) + 'm · 方位 ' + cfg.azimuthText) : '';

      if (cfg.styleTemplate === 0) {
        const grad = ctx.createLinearGradient(0, h - 380, 0, h);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.58)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, h - 380, w, 380);

        const cx = w / 2;
        let curY = h - 42;

        if (cfg.showNote && cfg.note) {
          ctx.font = '500 25px "Inter", sans-serif';
          ctx.fillStyle = '#fde68a';
          ctx.textAlign = 'center';
          ctx.fillText('备注：' + cfg.note, cx, curY);
          curY -= 38;
        }
        if (envLine) {
          ctx.font = '600 22px "JetBrains Mono", monospace';
          ctx.fillStyle = '#a7f3d0';
          ctx.textAlign = 'center';
          ctx.fillText(envLine, cx, curY);
          curY -= 36;
        }
        if (cfg.showCoords) {
          ctx.font = '600 25px "JetBrains Mono", monospace';
          const tw = ctx.measureText(coordLine).width;
          ctx.fillStyle = 'rgba(11, 19, 43, 0.72)';
          ctx.beginPath();
          ctx.roundRect(cx - tw / 2 - 22, curY - 30, tw + 44, 42, 21);
          ctx.fill();
          ctx.fillStyle = '#38bdf8';
          ctx.textAlign = 'center';
          ctx.fillText(coordLine, cx, curY);
          curY -= 54;
        }
        if (cfg.showTime || cfg.showLoc) {
          ctx.font = '400 35px "Inter", sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          const lineStr = (cfg.showTime ? cfg.dateWeek + ' ' : '') + (cfg.showLoc ? ('📍' + cfg.shortPoi) : '');
          ctx.fillText(lineStr, cx, curY);
          curY -= 58;
        }
        if (cfg.showTime) {
          ctx.font = '300 120px "Inter", sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.fillText(cfg.hm, cx, curY);
        }
      } else if (cfg.styleTemplate === 1) {
        // Style 1: 工程巡检卡片
        const boxW = cfg.showQr ? 720 : 840;
        const boxH = 240;
        const boxLeft = 28, boxTop = h - boxH - 28;
        ctx.fillStyle = 'rgba(11, 19, 43, 0.80)';
        ctx.beginPath();
        ctx.roundRect(boxLeft, boxTop, boxW, boxH, 18);
        ctx.fill();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(boxLeft + 24, boxTop + 20, 7, 28);
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 27px "Inter", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('现场点位核验 · ' + cfg.coordSys, boxLeft + 42, boxTop + 43);

        ctx.font = '600 23px "JetBrains Mono", monospace';
        let y = boxTop + 92;
        if (cfg.showCoords) { ctx.fillStyle = '#38bdf8'; ctx.fillText('经纬：' + coordLine, boxLeft + 24, y); y += 38; }
        if (cfg.showLoc) { ctx.fillStyle = '#ffffff'; ctx.fillText('地点：' + cfg.shortPoi + ' (' + cfg.fullAddr + ')', boxLeft + 24, y); y += 38; }
        if (cfg.showTime) { ctx.fillStyle = '#cbd5e1'; ctx.fillText('时间：' + cfg.fullTs + ' ' + cfg.dateWeek.split(' ')[1], boxLeft + 24, y); y += 38; }
        if (cfg.showNote && cfg.note) { ctx.fillStyle = '#fde68a'; ctx.fillText('备注：' + cfg.note, boxLeft + 24, y); }
      } else if (cfg.styleTemplate === 2) {
        // Style 2: 经纬网格测绘
        const boxW = cfg.showQr ? 700 : 820;
        const boxH = 190;
        const boxLeft = 28, boxTop = h - boxH - 28;
        ctx.fillStyle = 'rgba(9, 14, 26, 0.82)';
        ctx.beginPath();
        ctx.roundRect(boxLeft, boxTop, boxW, boxH, 16);
        ctx.fill();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
        ctx.beginPath();
        ctx.roundRect(boxLeft, boxTop, boxW, 54, 16);
        ctx.fill();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
        ctx.lineWidth = 2;
        ctx.strokeRect(boxLeft, boxTop, boxW, boxH);

        ctx.fillStyle = '#38bdf8';
        ctx.font = '700 23px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(cfg.showCoords ? coordLine : ('经纬网格测绘 · ' + cfg.coordSys), boxLeft + 18, boxTop + 36);

        const midX = boxLeft + boxW * 0.48;
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
        ctx.beginPath();
        ctx.moveTo(boxLeft, boxTop + 54); ctx.lineTo(boxLeft + boxW, boxTop + 54);
        ctx.moveTo(midX, boxTop + 54); ctx.lineTo(midX, boxTop + 140);
        ctx.moveTo(boxLeft, boxTop + 140); ctx.lineTo(boxLeft + boxW, boxTop + 140);
        ctx.stroke();

        ctx.fillStyle = '#94a3b8'; ctx.font = '400 18px "Inter", sans-serif';
        ctx.fillText('测绘点位', boxLeft + 18, boxTop + 82);
        ctx.fillText('采样时间', midX + 18, boxTop + 82);

        ctx.fillStyle = '#ffffff'; ctx.font = '700 24px "Inter", sans-serif';
        ctx.fillText(cfg.shortPoi, boxLeft + 18, boxTop + 120);
        ctx.font = '600 21px "JetBrains Mono", monospace';
        ctx.fillText(cfg.fullTs, midX + 18, boxTop + 120);

        ctx.fillStyle = '#fde68a'; ctx.font = '400 20px "Inter", sans-serif';
        ctx.fillText((cfg.note || cfg.fullAddr || '高德 GCJ-02 零偏差对齐'), boxLeft + 18, boxTop + 172);
      } else if (cfg.styleTemplate === 3) {
        // Style 3: 极简胶片底栏
        const barH = 108;
        const barTop = h - barH;
        ctx.fillStyle = 'rgba(8, 12, 20, 0.88)';
        ctx.fillRect(0, barTop, w, barH);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, barTop); ctx.lineTo(w, barTop); ctx.stroke();

        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff'; ctx.font = '700 28px "Inter", sans-serif';
        ctx.fillText('📍 ' + cfg.shortPoi, 26, barTop + 42);
        ctx.fillStyle = '#94a3b8'; ctx.font = '400 21px "Inter", sans-serif';
        ctx.fillText(cfg.note || cfg.fullAddr || cfg.dateWeek, 26, barTop + 80);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#38bdf8'; ctx.font = '700 22px "JetBrains Mono", monospace';
        if (cfg.showCoords) ctx.fillText(coordLine, w - 26, barTop + 42);
        ctx.fillStyle = '#e2e8f0'; ctx.font = '500 21px "JetBrains Mono", monospace';
        if (cfg.showTime) ctx.fillText(cfg.fullTs + ' ' + cfg.dateWeek.split(' ')[1], w - 26, barTop + 80);
      } else {
        // Style 4: 外业标准台账
        const boxW = cfg.showQr ? 700 : 820;
        const rows = [];
        if (cfg.showCoords) rows.push(['经纬坐标', coordLine]);
        if (cfg.showLoc) rows.push(['点位地址', cfg.shortPoi + ' · ' + cfg.fullAddr]);
        if (cfg.showTime) rows.push(['记录时间', cfg.fullTs + ' ' + cfg.dateWeek.split(' ')[1]]);
        if (cfg.showNote && cfg.note) rows.push(['现场备注', cfg.note]);
        const headerH = 44, rowH = 40;
        const boxH = headerH + rows.length * rowH;
        const boxLeft = 28, boxTop = h - boxH - 28;

        ctx.fillStyle = 'rgba(11, 19, 43, 0.84)';
        ctx.beginPath(); ctx.roundRect(boxLeft, boxTop, boxW, boxH, 14); ctx.fill();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
        ctx.beginPath(); ctx.roundRect(boxLeft, boxTop, boxW, headerH, 14); ctx.fill();
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
        ctx.strokeRect(boxLeft, boxTop, boxW, boxH);

        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff'; ctx.font = '700 23px "Inter", sans-serif';
        ctx.fillText('外业定点巡检台账 · ' + cfg.coordSys, boxLeft + 14, boxTop + 30);

        const colSplit = boxLeft + 136;
        ctx.beginPath();
        ctx.moveTo(boxLeft, boxTop + headerH); ctx.lineTo(boxLeft + boxW, boxTop + headerH);
        ctx.moveTo(colSplit, boxTop + headerH); ctx.lineTo(colSplit, boxTop + boxH);
        ctx.stroke();

        ctx.font = '600 21px "JetBrains Mono", monospace';
        rows.forEach((r, idx) => {
          const ty = boxTop + headerH + idx * rowH;
          if (idx > 0) {
            ctx.beginPath(); ctx.moveTo(boxLeft, ty); ctx.lineTo(boxLeft + boxW, ty); ctx.stroke();
          }
          ctx.fillStyle = '#38bdf8';
          ctx.fillText(r[0], boxLeft + 14, ty + 28);
          ctx.fillStyle = r[0] === '现场备注' ? '#fde68a' : '#ffffff';
          ctx.fillText(r[1].slice(0, 32), colSplit + 12, ty + 28);
        });
      }

      // Draw Embedded Amap Location QR Badge ("扫码跳高德")
      if (cfg.showQr) {
        const qrUrl = 'https://uri.amap.com/marker?position=' + cfg.gcjLon.toFixed(6) + ',' + cfg.gcjLat.toFixed(6) +
          '&name=' + encodeURIComponent((cfg.shortPoi || '实拍点').slice(0, 8)) + '&coordinate=gaode&callnative=1';
        const mat = encodeQrMatrix(qrUrl);
        const modules = mat.length;
        const qrBoxSize = 142, labelH = 26;
        const totalH = qrBoxSize + labelH;
        const boxLeft = w - qrBoxSize - 26;
        const bottomOffset = cfg.styleTemplate === 3 ? 118 : 26;
        const boxTop = h - totalH - bottomOffset;

        ctx.fillStyle = 'rgba(11, 19, 43, 0.82)';
        ctx.beginPath(); ctx.roundRect(boxLeft, boxTop, qrBoxSize, totalH, 14); ctx.fill();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)'; ctx.lineWidth = 1.6; ctx.stroke();

        const pad = 10;
        const whiteSize = qrBoxSize - pad * 2;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.roundRect(boxLeft + pad, boxTop + pad, whiteSize, whiteSize, 6); ctx.fill();

        const quiet = 5;
        const drawSize = whiteSize - quiet * 2;
        const cell = drawSize / modules;
        const sx = boxLeft + pad + quiet;
        const sy = boxTop + pad + quiet;
        ctx.fillStyle = '#0b132b';
        for (let r = 0; r < modules; r++) {
          for (let c = 0; c < modules; c++) {
            if (mat[r][c]) {
              ctx.fillRect(sx + c * cell, sy + r * cell, cell + 0.35, cell + 0.35);
            }
          }
        }
        ctx.fillStyle = '#38bdf8';
        ctx.font = '700 15px "Inter", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('扫码跳高德', boxLeft + qrBoxSize / 2, boxTop + qrBoxSize + 18);
      }
    }

    function updateLiveOverlay() {
      const t = getNowTimeParts();
      const modeName = state.captureMode === 1 ? '光学拍照' : '0ms截屏';
      document.getElementById('gpsPillText').textContent = state.coordSys + ' · ±' + state.accuracy.toFixed(1) + 'm · ' + modeName;
      document.getElementById('captureModeLabel').textContent = modeName;

      const vfCanvas = document.getElementById('viewfinderCanvas');
      const video = document.getElementById('cameraVideo');
      const filterCss = FILTER_CSS[state.filterIdx] || 'none';
      vfCanvas.style.filter = filterCss;
      video.style.filter = filterCss;

      const wmCanvas = document.getElementById('liveWatermarkCanvas');
      const ctx = wmCanvas.getContext('2d');
      ctx.clearRect(0, 0, wmCanvas.width, wmCanvas.height);

      drawWatermarkOnCanvas(ctx, wmCanvas.width, wmCanvas.height, {
        styleTemplate: state.styleTemplate,
        coordSys: state.coordSys,
        coordFmt: state.coordFmt,
        gcjLat: state.gcjLat,
        gcjLon: state.gcjLon,
        wgsLat: state.wgsLat,
        wgsLon: state.wgsLon,
        accuracy: state.accuracy,
        altitude: state.altitude,
        azimuthText: state.azimuthText,
        shortPoi: state.shortPoi,
        fullAddr: state.fullAddr,
        hm: t.hm,
        dateWeek: t.dateWeek,
        fullTs: t.fullTs,
        note: state.note,
        showQr: state.showQr,
        showTime: state.showTime,
        showLoc: state.showLoc,
        showCoords: state.showCoords,
        showNote: state.showNote,
        showEnv: state.showEnv
      });
    }

    function compositePhotoCanvas(cleanDataUrl, cfg, cb) {
      const img = new Image();
      img.onload = function() {
        const c = document.createElement('canvas');
        c.width = 1080;
        c.height = 1440;
        const ctx = c.getContext('2d');
        ctx.filter = FILTER_CSS[cfg.filterIdx || 0] || 'none';
        ctx.drawImage(img, 0, 0, c.width, c.height);
        ctx.filter = 'none';
        drawWatermarkOnCanvas(ctx, c.width, c.height, cfg);
        cb(c.toDataURL('image/jpeg', 0.95));
      };
      img.src = cleanDataUrl;
    }

    function capturePhotoNow() {
      const flashEl = document.getElementById('shutterFlashOverlay');
      flashEl.classList.remove('animate-flash');
      void flashEl.offsetWidth;
      flashEl.classList.add('animate-flash');

      const vfCanvas = document.getElementById('viewfinderCanvas');
      const video = document.getElementById('cameraVideo');
      const cleanCanvas = document.createElement('canvas');
      cleanCanvas.width = 1080;
      cleanCanvas.height = 1440;
      const ctx = cleanCanvas.getContext('2d');
      if (state.usingRealCam && video.readyState >= 2) {
        ctx.drawImage(video, 0, 0, 1080, 1440);
      } else {
        ctx.drawImage(vfCanvas, 0, 0, 1080, 1440);
      }
      const cleanUrl = cleanCanvas.toDataURL('image/jpeg', 0.96);
      const t = getNowTimeParts();

      const cfg = {
        styleTemplate: state.styleTemplate,
        coordSys: state.coordSys,
        coordFmt: state.coordFmt,
        filterIdx: state.filterIdx,
        gcjLat: state.gcjLat,
        gcjLon: state.gcjLon,
        wgsLat: state.wgsLat,
        wgsLon: state.wgsLon,
        origGcjLat: state.gcjLat,
        origGcjLon: state.gcjLon,
        accuracy: state.accuracy,
        altitude: state.altitude,
        azimuthText: state.azimuthText,
        shortPoi: state.shortPoi,
        fullAddr: state.fullAddr,
        hm: t.hm,
        dateWeek: t.dateWeek,
        fullTs: t.fullTs,
        note: state.note,
        showQr: state.showQr,
        showTime: state.showTime,
        showLoc: state.showLoc,
        showCoords: state.showCoords,
        showNote: state.showNote,
        showEnv: state.showEnv
      };

      compositePhotoCanvas(cleanUrl, cfg, function(wmUrl) {
        const entry = {
          id: 'p_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          cleanUrl: cleanUrl,
          wmUrl: wmUrl,
          cfg: cfg
        };
        state.photos.unshift(entry);
        state.selectedPhotoId = entry.id;
        document.getElementById('bottomGalleryThumb').src = wmUrl;
        renderGalleryScreen();
        showToast(state.captureMode === 1 ? '📷 光学拍照已完成 (高德GCJ-02零偏差已对齐)' : '⚡ 0ms极速截屏已完成');
      });
    }

    function renderGalleryScreen() {
      document.getElementById('galleryTitleText').textContent = '已拍相册 (' + state.photos.length + ')';
      const selected = state.photos.find(p => p.id === state.selectedPhotoId) || state.photos[0];
      if (!selected) return;
      state.selectedPhotoId = selected.id;

      document.getElementById('galleryMainImg').src = selected.wmUrl;
      document.getElementById('galleryPoiTitle').textContent = '📍 ' + selected.cfg.shortPoi + (selected.cfg.note ? (' · ' + selected.cfg.note) : '');
      document.getElementById('galleryGcjText').textContent = '高德 GCJ-02: ' + selected.cfg.gcjLat.toFixed(6) + '°N, ' + selected.cfg.gcjLon.toFixed(6) + '°E';
      document.getElementById('galleryWgsText').textContent = '原始 WGS-84: ' + selected.cfg.wgsLat.toFixed(6) + '°N, ' + selected.cfg.wgsLon.toFixed(6) + '°E';

      const poiname = encodeURIComponent(selected.cfg.shortPoi || '实拍点位');
      const lat = selected.cfg.gcjLat.toFixed(6);
      const lon = selected.cfg.gcjLon.toFixed(6);

      document.getElementById('btnGalleryJumpAmapPin').href =
        'https://uri.amap.com/marker?position=' + lon + ',' + lat + '&name=' + poiname + '&coordinate=gaode&callnative=1';
      document.getElementById('btnGalleryJumpAmapNavi').href =
        'https://uri.amap.com/navigation?to=' + lon + ',' + lat + ',' + poiname + '&mode=car&coordinate=gaode&callnative=1';

      const strip = document.getElementById('galleryThumbStrip');
      strip.innerHTML = '';
      state.photos.forEach(p => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-14 h-14 rounded-lg overflow-hidden shrink-0 border-2 ' + (p.id === selected.id ? 'border-sky-400' : 'border-neutral-700');
        btn.innerHTML = '<img src="' + p.wmUrl + '" alt="缩略图" class="w-full h-full object-cover" />';
        btn.addEventListener('click', function() {
          state.selectedPhotoId = p.id;
          renderGalleryScreen();
        });
        strip.appendChild(btn);
      });
    }

    window.addEventListener('DOMContentLoaded', function() {
      const vfCanvas = document.getElementById('viewfinderCanvas');
      const ctx = vfCanvas.getContext('2d');
      drawViewfinderScene(ctx, vfCanvas.width, vfCanvas.height);
      updateLiveOverlay();
      setInterval(updateLiveOverlay, 1000);

      capturePhotoNow();

      const TPL_NAMES = ['经典大字时间', '工程巡检卡片', '经纬网格测绘', '极简胶片底栏', '外业标准台账'];
      function syncTplPills() {
        document.querySelectorAll('.tpl-quick-pill').forEach(btn => {
          const idx = parseInt(btn.getAttribute('data-tpl'), 10);
          btn.className = idx === state.styleTemplate
            ? 'tpl-quick-pill flex-1 py-1 rounded-full font-bold bg-sky-600 text-white'
            : 'tpl-quick-pill flex-1 py-1 rounded-full text-slate-400 bg-slate-900';
        });
      }
      function switchTemplateByIndex(nextIdx) {
        state.styleTemplate = ((nextIdx % 5) + 5) % 5;
        syncTplPills();
        updateLiveOverlay();
        showToast('🎨 模板 ' + (state.styleTemplate + 1) + '/5 · ' + TPL_NAMES[state.styleTemplate]);
      }
      document.querySelectorAll('.tpl-quick-pill').forEach(btn => {
        btn.addEventListener('click', function() {
          switchTemplateByIndex(parseInt(this.getAttribute('data-tpl'), 10));
        });
      });

      function syncCaptureModeButtons() {
        const optBtn = document.getElementById('btnSetModeOptical');
        const scrBtn = document.getElementById('btnSetModeScreen');
        if (state.captureMode === 1) {
          optBtn.className = 'py-2 rounded-lg bg-sky-600 text-white font-bold border border-sky-400';
          scrBtn.className = 'py-2 rounded-lg bg-slate-800 text-slate-300 border border-slate-700';
        } else {
          optBtn.className = 'py-2 rounded-lg bg-slate-800 text-slate-300 border border-slate-700';
          scrBtn.className = 'py-2 rounded-lg bg-sky-600 text-white font-bold border border-sky-400';
        }
        updateLiveOverlay();
      }
      document.getElementById('btnTopCaptureMode').addEventListener('click', function() {
        state.captureMode = state.captureMode === 1 ? 0 : 1;
        syncCaptureModeButtons();
        showToast(state.captureMode === 1 ? '已切换至：📷 光学拍照模式' : '已切换至：⚡ 极速截屏模式');
      });
      document.getElementById('btnSetModeOptical').addEventListener('click', function() {
        state.captureMode = 1;
        syncCaptureModeButtons();
      });
      document.getElementById('btnSetModeScreen').addEventListener('click', function() {
        state.captureMode = 0;
        syncCaptureModeButtons();
      });

      // Swipe on viewfinder to switch templates
      let touchStartX = null, touchStartY = null;
      const vfContainer = document.getElementById('viewfinderContainer');
      vfContainer.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });
      vfContainer.addEventListener('touchend', function(e) {
        if (touchStartX === null || !e.changedTouches.length) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        touchStartX = null;
        if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.3) {
          switchTemplateByIndex(state.styleTemplate + (dx < 0 ? 1 : -1));
        }
      }, { passive: true });

      document.getElementById('viewfinderContainer').addEventListener('click', function(e) {
        if (e.target.closest('#btnZoomCircle') || e.target.closest('#btnGpsPill')) return;
        const rect = this.getBoundingClientRect();
        if (e.clientY - rect.top > rect.height * 0.72) {
          openWmCustomizer(null);
          return;
        }
        const x = Math.max(40, Math.min(rect.width - 90, e.clientX - rect.left - 39));
        const y = Math.max(40, Math.min(rect.height - 90, e.clientY - rect.top - 39));
        const fb = document.getElementById('focusBoxWrapper');
        fb.style.left = x + 'px';
        fb.style.top = y + 'px';
      });

      document.getElementById('btnTopSettings').addEventListener('click', () => {
        document.getElementById('modalSettings').classList.remove('hidden');
      });
      document.getElementById('btnCloseSettingsModal').addEventListener('click', () => {
        document.getElementById('modalSettings').classList.add('hidden');
      });
      document.getElementById('btnDoneSettings').addEventListener('click', () => {
        document.getElementById('modalSettings').classList.add('hidden');
      });

      const inlineTimerBar = document.getElementById('inlineTimerBar');
      const inlineFlashBar = document.getElementById('inlineFlashBar');
      const topRightRow = document.getElementById('topRightIconsRow');

      document.getElementById('btnTopTimer').addEventListener('click', function() {
        inlineFlashBar.classList.add('hidden');
        inlineFlashBar.classList.remove('flex');
        topRightRow.classList.add('hidden');
        inlineTimerBar.classList.remove('hidden');
        inlineTimerBar.classList.add('flex');
      });

      document.querySelectorAll('.timer-opt').forEach(btn => {
        btn.addEventListener('click', function() {
          state.timerSec = parseInt(this.getAttribute('data-timer'), 10);
          document.querySelectorAll('.timer-opt').forEach(b => {
            b.className = 'timer-opt px-2.5 py-0.5 rounded-full text-slate-300';
          });
          this.className = 'timer-opt px-2.5 py-0.5 rounded-full bg-sky-600 text-white font-bold';
          const badge = document.getElementById('timerBadgeText');
          if (state.timerSec > 0) {
            badge.textContent = String(state.timerSec);
            badge.classList.remove('hidden');
          } else {
            badge.classList.add('hidden');
          }
          inlineTimerBar.classList.add('hidden');
          inlineTimerBar.classList.remove('flex');
          topRightRow.classList.remove('hidden');
        });
      });

      document.getElementById('btnTopFlash').addEventListener('click', function() {
        inlineTimerBar.classList.add('hidden');
        inlineTimerBar.classList.remove('flex');
        topRightRow.classList.add('hidden');
        inlineFlashBar.classList.remove('hidden');
        inlineFlashBar.classList.add('flex');
      });

      document.querySelectorAll('.flash-opt').forEach(btn => {
        btn.addEventListener('click', function() {
          state.flashMode = parseInt(this.getAttribute('data-flash'), 10);
          document.querySelectorAll('.flash-opt').forEach(b => {
            b.className = 'flash-opt px-2.5 py-0.5 rounded-full text-slate-300';
          });
          this.className = 'flash-opt px-2.5 py-0.5 rounded-full bg-amber-500 text-black font-bold';
          const labels = ['关', '开', '自动', '常亮'];
          document.getElementById('flashBadgeText').textContent = labels[state.flashMode];
          inlineFlashBar.classList.add('hidden');
          inlineFlashBar.classList.remove('flex');
          topRightRow.classList.remove('hidden');
        });
      });

      document.getElementById('btnTopFlip').addEventListener('click', function() {
        state.isFront = !state.isFront;
        showToast(state.isFront ? '已切换至前置镜头' : '已切换至后置镜头');
      });

      document.getElementById('btnZoomCircle').addEventListener('click', function() {
        state.zoom = state.zoom === 1.0 ? 1.5 : (state.zoom === 1.5 ? 2.0 : 1.0);
        this.textContent = state.zoom.toFixed(1) + 'X';
      });

      document.getElementById('btnShutterMain').addEventListener('click', function() {
        if (state.timerSec > 0) {
          const ov = document.getElementById('countdownOverlay');
          const num = document.getElementById('countdownNumText');
          let rem = state.timerSec;
          ov.classList.remove('hidden');
          num.textContent = String(rem);
          const timer = setInterval(() => {
            rem--;
            if (rem <= 0) {
              clearInterval(timer);
              ov.classList.add('hidden');
              capturePhotoNow();
            } else {
              num.textContent = String(rem);
            }
          }, 1000);
        } else {
          capturePhotoNow();
        }
      });

      document.getElementById('btnBottomGallery').addEventListener('click', function() {
        renderGalleryScreen();
        document.getElementById('screenGallery').classList.remove('hidden');
        document.getElementById('screenGallery').classList.add('flex');
      });
      document.getElementById('btnGalleryBack').addEventListener('click', function() {
        document.getElementById('screenGallery').classList.add('hidden');
        document.getElementById('screenGallery').classList.remove('flex');
      });

      document.getElementById('btnBottomLocation').addEventListener('click', () => {
        document.getElementById('modalLocation').classList.remove('hidden');
      });
      document.getElementById('btnGpsPill').addEventListener('click', () => {
        document.getElementById('modalLocation').classList.remove('hidden');
      });
      document.getElementById('btnCloseLocationModal').addEventListener('click', () => {
        document.getElementById('modalLocation').classList.add('hidden');
      });

      document.getElementById('btnSaveLocationModal').addEventListener('click', () => {
        state.shortPoi = document.getElementById('inputShortPoi').value || '实拍点位';
        state.fullAddr = document.getElementById('inputFullAddr').value || '';
        const newLat = parseFloat(document.getElementById('inputManualLat').value);
        const newLon = parseFloat(document.getElementById('inputManualLon').value);
        if (!isNaN(newLat) && !isNaN(newLon)) {
          state.gcjLat = Number(newLat.toFixed(6));
          state.gcjLon = Number(newLon.toFixed(6));
          const wgs = gcj02ToWgs84(state.gcjLat, state.gcjLon);
          state.wgsLat = wgs.lat;
          state.wgsLon = wgs.lon;
        }
        updateLiveOverlay();
        document.getElementById('modalLocation').classList.add('hidden');
        showToast('已更新当前地点与高德坐标');
      });

      document.getElementById('btnRequestRealGps').addEventListener('click', () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            state.wgsLat = Number(pos.coords.latitude.toFixed(6));
            state.wgsLon = Number(pos.coords.longitude.toFixed(6));
            const gcj = wgs84ToGcj02(state.wgsLat, state.wgsLon);
            state.gcjLat = gcj.lat;
            state.gcjLon = gcj.lon;
            state.accuracy = pos.coords.accuracy || 2.5;
            document.getElementById('inputManualLat').value = state.gcjLat;
            document.getElementById('inputManualLon').value = state.gcjLon;
            document.getElementById('locModalGcj').textContent = state.gcjLat + ', ' + state.gcjLon;
            document.getElementById('locModalWgs').textContent = state.wgsLat + ', ' + state.wgsLon;
            updateLiveOverlay();
            showToast('成功锁定手机真实GPS并对齐高德GCJ-02！');
          }, () => {
            showToast('未获取到浏览器定位授权，已保持当前精准坐标');
          }, { enableHighAccuracy: true, timeout: 5000 });
        }
      });

      document.getElementById('btnBottomFilter').addEventListener('click', () => {
        document.getElementById('filterBarStrip').classList.toggle('hidden');
      });
      document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.addEventListener('click', function() {
          state.filterIdx = parseInt(this.getAttribute('data-filter'), 10);
          document.querySelectorAll('.filter-chip').forEach(b => {
            b.className = 'filter-chip px-3 py-1 rounded-full text-xs text-neutral-300 bg-neutral-800';
          });
          this.className = 'filter-chip px-3 py-1 rounded-full text-xs font-semibold bg-sky-600 text-white';
          updateLiveOverlay();
        });
      });

      function openWmCustomizer(targetPhoto) {
        state.editingTargetPhotoId = targetPhoto ? targetPhoto.id : null;
        document.getElementById('wmModalTitle').textContent = targetPhoto
          ? '✎ 无损重绘已拍照片水印 (图层分离)'
          : '🎨 水印模板与字段定制';
        const row = document.getElementById('wmEditCoordRow');
        if (targetPhoto) {
          row.classList.remove('hidden');
          row.classList.add('grid');
          document.getElementById('wmSelectStyle').value = String(targetPhoto.cfg.styleTemplate);
          document.getElementById('wmSelectCoordSys').value = targetPhoto.cfg.coordSys;
          document.getElementById('wmInputPoi').value = targetPhoto.cfg.shortPoi;
          document.getElementById('wmSelectDms').value = targetPhoto.cfg.coordFmt;
          document.getElementById('wmEditLat').value = targetPhoto.cfg.gcjLat;
          document.getElementById('wmEditLon').value = targetPhoto.cfg.gcjLon;
          document.getElementById('wmInputNote').value = targetPhoto.cfg.note;
          document.getElementById('wmChkQr').checked = targetPhoto.cfg.showQr !== false;
        } else {
          row.classList.add('hidden');
          row.classList.remove('grid');
          document.getElementById('wmSelectStyle').value = String(state.styleTemplate);
          document.getElementById('wmSelectCoordSys').value = state.coordSys;
          document.getElementById('wmInputPoi').value = state.shortPoi;
          document.getElementById('wmSelectDms').value = state.coordFmt;
          document.getElementById('wmInputNote').value = state.note;
          document.getElementById('wmChkQr').checked = state.showQr;
        }
        document.getElementById('modalWatermark').classList.remove('hidden');
      }

      document.getElementById('btnBottomWatermark').addEventListener('click', () => openWmCustomizer(null));
      document.getElementById('btnCloseWmModal').addEventListener('click', () => {
        document.getElementById('modalWatermark').classList.add('hidden');
      });

      document.getElementById('btnGalleryEditWm').addEventListener('click', function() {
        const selected = state.photos.find(p => p.id === state.selectedPhotoId);
        if (selected) openWmCustomizer(selected);
      });

      document.getElementById('btnApplyWmModal').addEventListener('click', function() {
        const tpl = parseInt(document.getElementById('wmSelectStyle').value, 10);
        const sys = document.getElementById('wmSelectCoordSys').value;
        const poi = document.getElementById('wmInputPoi').value || '实拍点位';
        const fmt = document.getElementById('wmSelectDms').value;
        const note = document.getElementById('wmInputNote').value;
        const sQr = document.getElementById('wmChkQr').checked;
        const sTime = document.getElementById('wmChkTime').checked;
        const sLoc = document.getElementById('wmChkLoc').checked;
        const sCoords = document.getElementById('wmChkCoords').checked;
        const sNote = document.getElementById('wmChkNote').checked;
        const sEnv = document.getElementById('wmChkEnv').checked;

        if (state.editingTargetPhotoId) {
          const target = state.photos.find(p => p.id === state.editingTargetPhotoId);
          if (target) {
            const newLat = parseFloat(document.getElementById('wmEditLat').value) || target.cfg.gcjLat;
            const newLon = parseFloat(document.getElementById('wmEditLon').value) || target.cfg.gcjLon;
            const wgs = gcj02ToWgs84(newLat, newLon);
            target.cfg.styleTemplate = tpl;
            target.cfg.coordSys = sys;
            target.cfg.shortPoi = poi;
            target.cfg.coordFmt = fmt;
            target.cfg.gcjLat = Number(newLat.toFixed(6));
            target.cfg.gcjLon = Number(newLon.toFixed(6));
            target.cfg.wgsLat = wgs.lat;
            target.cfg.wgsLon = wgs.lon;
            target.cfg.note = note;
            target.cfg.showQr = sQr;
            target.cfg.showTime = sTime;
            target.cfg.showLoc = sLoc;
            target.cfg.showCoords = sCoords;
            target.cfg.showNote = sNote;
            target.cfg.showEnv = sEnv;

            compositePhotoCanvas(target.cleanUrl, target.cfg, function(newWmUrl) {
              target.wmUrl = newWmUrl;
              renderGalleryScreen();
              document.getElementById('bottomGalleryThumb').src = state.photos[0].wmUrl;
              document.getElementById('modalWatermark').classList.add('hidden');
              showToast('已基于无水印底图无损重绘，高德定位码与跳转坐标已同步更新！');
            });
            return;
          }
        }

        state.styleTemplate = tpl;
        state.coordSys = sys;
        state.shortPoi = poi;
        state.coordFmt = fmt;
        state.note = note;
        state.showQr = sQr;
        state.showTime = sTime;
        state.showLoc = sLoc;
        state.showCoords = sCoords;
        state.showNote = sNote;
        state.showEnv = sEnv;
        syncTplPills();
        updateLiveOverlay();
        document.getElementById('modalWatermark').classList.add('hidden');
        showToast('水印设置已实时生效');
      });

      document.getElementById('btnGalleryCopyCoord').addEventListener('click', function() {
        const selected = state.photos.find(p => p.id === state.selectedPhotoId);
        if (!selected) return;
        const txt = selected.cfg.gcjLon.toFixed(6) + ',' + selected.cfg.gcjLat.toFixed(6);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt);
        }
        showToast('已复制高德坐标: ' + txt);
      });

      document.getElementById('btnGalleryDownload').addEventListener('click', function() {
        const selected = state.photos.find(p => p.id === state.selectedPhotoId);
        if (!selected) return;
        const a = document.createElement('a');
        a.href = selected.wmUrl;
        a.download = '高德经纬水印_' + selected.cfg.shortPoi + '.jpg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast('已导出高清水印照片');
      });

      document.getElementById('inputImportExifPhoto').addEventListener('change', function(e) {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
          const cleanUrl = evt.target.result;
          const t = getNowTimeParts();
          const cfg = {
            styleTemplate: state.styleTemplate,
            coordSys: state.coordSys,
            coordFmt: state.coordFmt,
            filterIdx: state.filterIdx,
            gcjLat: state.gcjLat,
            gcjLon: state.gcjLon,
            wgsLat: state.wgsLat,
            wgsLon: state.wgsLon,
            origGcjLat: state.gcjLat,
            origGcjLon: state.gcjLon,
            accuracy: 2.8,
            altitude: state.altitude,
            azimuthText: state.azimuthText,
            shortPoi: state.shortPoi,
            fullAddr: state.fullAddr,
            hm: t.hm,
            dateWeek: t.dateWeek,
            fullTs: t.fullTs,
            note: '相册导入照片 · 已对齐高德GCJ-02',
            showQr: state.showQr,
            showTime: true,
            showLoc: true,
            showCoords: true,
            showNote: true,
            showEnv: state.showEnv
          };
          compositePhotoCanvas(cleanUrl, cfg, function(wmUrl) {
            const entry = {
              id: 'imp_' + Date.now(),
              cleanUrl: cleanUrl,
              wmUrl: wmUrl,
              cfg: cfg
            };
            state.photos.unshift(entry);
            state.selectedPhotoId = entry.id;
            renderGalleryScreen();
            showToast('已导入相册照片并对齐高德GCJ-02坐标');
          });
        };
        reader.readAsDataURL(f);
        this.value = '';
      });

      document.getElementById('btnToggleHardwareCam').addEventListener('click', function() {
        const video = document.getElementById('cameraVideo');
        const canvas = document.getElementById('viewfinderCanvas');
        if (!state.usingRealCam && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false })
            .then(stream => {
              state.stream = stream;
              video.srcObject = stream;
              state.usingRealCam = true;
              video.classList.remove('hidden');
              canvas.classList.add('hidden');
              this.textContent = '已开启摄像头';
              showToast('手机光学摄像头已启用');
            })
            .catch(() => showToast('未授予摄像头权限，已使用实景模拟取景'));
        }
      });
    });
  </script>
</body>
</html>
